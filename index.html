<!-- Inserção Manual de Resultado -->
<div class="bg-sport-card border border-sport-border p-6 rounded-2xl shadow-xl space-y-4">
    <h4 class="text-lg font-bold text-white flex items-center space-x-2">
        <i class="fa-solid fa-keyboard text-sport-blue"></i>
        <span>Inserção Manual de Resultado</span>
    </h4>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- NOVO CAMPO: Username -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Username (App Virtual)</label>
            <input type="text" id="manual-username" placeholder="Ex: J.Doe_BR" class="w-full bg-sport-dark border border-sport-border rounded-xl px-3 py-2 text-white focus:outline-none focus:border-sport-blue">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Atleta (Nome Completo)</label>
            <input type="text" id="manual-atleta" placeholder="Nome do Atleta" class="w-full bg-sport-dark border border-sport-border rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-sport-blue">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Naipe</label>
            <select id="manual-naipe" class="w-full bg-sport-dark border border-sport-border rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-sport-blue">
                <option value="MAS">Masculino (MAS)</option>
                <option value="FEM">Feminino (FEM)</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Categoria</label>
            <input type="text" id="manual-categoria" placeholder="Ex: SUB-30" class="w-full bg-sport-dark border border-sport-border rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-sport-blue">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Estado (Sigla)</label>
            <input type="text" id="manual-estado" placeholder="Ex: SP, RJ" maxlength="2" class="w-full bg-sport-dark border border-sport-border rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-sport-blue">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Bateria</label>
            <select id="manual-bateria" class="w-full bg-sport-dark border border-sport-border rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-sport-blue">
                <!-- Preenchido dinamicamente via JS -->
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Tempo Oficial</label>
            <input type="text" id="manual-tempo" placeholder="00:00:00" class="w-full bg-sport-dark border border-sport-border rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-sport-blue">
        </div>
        <div class="flex items-end">
            <button onclick="addManualRecord()" class="w-full py-2.5 bg-sport-blue hover:bg-blue-600 text-white font-bold rounded-xl transition-all shadow-md">
                Adicionar
            </button>
        </div>
    </div>
</div>
